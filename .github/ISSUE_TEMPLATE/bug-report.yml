name: 不具合の報告
description: エージェントやスクリプトが手順どおりに動かないときに報告する
title: "[bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        エージェントが procedures/ や AGENTS.md の手順どおりに動かなかったとき、スクリプトがエラーになったときに使います。
        日次ノートや wiki の抜粋を貼るときは、認証情報・顧客名・私的な内容を `***` にマスクしてください。
  - type: dropdown
    id: operation
    attributes:
      label: 操作（トリガー）
      description: 不具合が起きたときに行った操作を選んでください。
      options:
        - 業務開始（本日の業務を開始する）
        - タスク記録（開始・内容・完了・中断・メモ・調査・問題・アイデア・学んだこと）
        - 業務終了・コミット（本日の業務を終了する）
        - 週報作成（今週の週報を作成して）
        - PJコード追加（プロジェクトコードを追加）
        - wiki Ingest（wikiに追加）
        - wiki Query（wikiで調べて）
        - wiki Lint（wikiを点検）
        - テンプレート更新の取り込み
        - スクリプト（now.ps1・get-week.ps1・secret-scan.ps1・check_evidence.py）
        - GitHub Actions（update-skills）
        - その他
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: 送った発言・実行したコマンド
      description: チャットで送った発言や、実行したコマンドをそのまま貼ってください。
      placeholder: |
        API設計レビューを開始 @[クラウドデータ基盤]
        内容: エンドポイントの命名規則を統一する方針にした
        完了
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待した結果
      description: 手順やREADMEから、どうなるはずだと考えたかを書いてください。
      placeholder: 「⏱ 工数」表に API設計レビュー 1.50h の行が追加される
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 実際の結果
      description: エージェントの応答、生成・変更されたファイルの抜粋、エラーメッセージなどを書いてください。
      placeholder: 工数表に行が追加されず、作業ログにだけ記録された
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: 関係しそうなファイル
      description: 原因と思われる手順書・テンプレート・スクリプトがあれば書いてください。
      placeholder: procedures/task-log.md、.foam/templates/daily-note.md
  - type: input
    id: agent
    attributes:
      label: エージェントとモデル
      placeholder: Claude Code 2.x / Opus 5.5
  - type: input
    id: template-version
    attributes:
      label: テンプレートのバージョン
      description: 派生リポジトリで起きた場合は、`.template-version` のコミット、または最後に取り込んだ日付を書いてください。
      placeholder: 46f9c72 / 2026-10-22 に取り込み
  - type: input
    id: environment
    attributes:
      label: 環境
      placeholder: Windows 11 / PowerShell 7.5 / VS Code 1.10x / Foam 0.2x
  - type: checkboxes
    id: confidentiality
    attributes:
      label: 確認
      options:
        - label: 認証情報・顧客名・日次ノートの私的な内容を含めていない（含む場合は `***` にマスクした）
          required: true
