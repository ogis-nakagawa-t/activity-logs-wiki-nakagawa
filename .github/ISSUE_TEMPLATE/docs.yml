name: ドキュメントの誤り
description: README・AGENTS.md・procedures/ などの誤り、分かりにくさ、記述の食い違いを報告する
title: "[docs] "
labels: [documentation]
body:
  - type: input
    id: location
    attributes:
      label: 対象ファイルと見出し
      placeholder: README.md「工数入力」
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 問題点
      description: 誤り、分かりにくい箇所、README と AGENTS.md・procedures/ の食い違いなどを書いてください。
      placeholder: README では「完了」で作業ログに1行追記するとあるが、procedures/task-log.md には書かれていない
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: 修正案
      description: 直し方の案があれば書いてください。
  - type: checkboxes
    id: confidentiality
    attributes:
      label: 確認
      options:
        - label: 認証情報・顧客名・日次ノートの私的な内容を含めていない（含む場合は `***` にマスクした）
          required: true
